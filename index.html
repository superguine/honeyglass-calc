<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blob3"></div>
<main class="calc" aria-label="Calculator">
  <div class="screen" aria-live="polite">
    <div class="expr" id="expr"></div>
    <div class="value" id="value">0</div>
  </div>
  <div class="keys" id="keys">
    <button class="fn" data-k="AC" aria-label="Clear all">AC</button>
    <button class="fn" data-k="back" aria-label="Delete last digit">⌫</button>
    <button class="fn" data-k="%" aria-label="Percent">%</button>
    <button class="op" data-k="/" aria-label="Divide">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*" aria-label="Multiply">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-" aria-label="Subtract">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+" aria-label="Add">+</button>
    <button class="zero" data-k="0">0</button>
    <button data-k=".">.</button>
    <button class="eq" data-k="=" aria-label="Equals">=</button>
  </div>
</main>
<script src="calculator-core.js"></script>
<script src="script.js"></script>
</body>
</html>
